# CI: build and test on every push and pull request targeting main.
# McpSense generates no code (specs are parsed at run time), so it has none of the generation or
# spec-sync steps that line-openapi-dotnet needs.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The NuGet vulnerability audit is the real gate. NuGetAudit runs during restore and reports
      # NU1901-NU1904 for vulnerable direct and transitive packages; promoting those to errors
      # fails the build on any advisory. `dotnet list --vulnerable` returns exit 0 and so cannot
      # gate anything - it is used below only for a readable summary.
      - name: Restore (audit advisories as errors)
        run: >
          dotnet restore McpSense.slnx
          -p:NuGetAuditMode=all
          -warnaserror:NU1901,NU1902,NU1903,NU1904

      - name: Build
        run: dotnet build McpSense.slnx --configuration Release --no-restore

      - name: Vulnerability audit (summary)
        run: dotnet list McpSense.slnx package --vulnerable --include-transitive

      - name: Test
        run: dotnet test McpSense.slnx --configuration Release --no-build --verbosity normal
